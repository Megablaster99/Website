<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Socials</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #ff6600;
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .description {
            background-color: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .project-card {
            background-color: white;
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .project-card h2 {
            margin-top: 0;
            color: #ff6600;
            font-size: 1.2rem;
        }
        .project-card p {
            margin-bottom: 1rem;
            color: #666;
        }
        .project-link {
            display: inline-block;
            background-color: #ff6600;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 0.5rem;
        }
        .project-link:hover {
            background-color: #e65c00;
        }
        .project-page {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .project-page h1 {
            color: #ff6600;
        }
        .embed-container {
            margin: 1rem 0;
            text-align: center;
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #ff6600;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Socials</h1>
    </header>
    
    <div class="container">
        <div class="description">
            <h2>My socials</h2>
            <p>Platforms i'm on and what i go by on them</p>
        </div>

        <div class="projects-grid">
            <div class="project-card">
                <h2>YouTube</h2>
                <p>My YouTube channel</p>
                <a href="https://www.youtube.com/@MegablasterGaming" class="project-link">View channel</a>
            </div>
            
            <div class="project-card">
                <h2>Medal</h2>
                <p>My Medal.tv account</p>
                <a href="https://medal.tv/u/megablasteryt" class="project-link">View channel</a>
            </div>
            
            <div class="project-card">
                <h2>Discord Server</h2>
                <p>My community Discord server</p>
                <a href="https://discord.gg/39uDW333Ya" class="project-link">Join server</a>
            </div>
            
            <div class="project-card">
                <h2>Discord Username</h2>
                <p>My community Discord username</p>
                <a href="javascript:void(0)" onclick="copyText('megablasteryt_')" class="project-link">Copy username</a>
            </div>
            
            <script>
                function copyText(textToCopy) {
                    navigator.clipboard.writeText(textToCopy)
                }
            </script>
        </div>
    <footer>
        <p> </p>
    </footer>
</body>
</html>

</html>
